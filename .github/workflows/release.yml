name: Release and Publish

on:
  push:
    branches:
      - main

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # to push new version tag and commit
      issues: write # to comment on released issues
      pull-requests: write # to comment on released pull requests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Install semantic-release and plugins
        run: npm install --global semantic-release @semantic-release/changelog @semantic-release/exec @semantic-release/git @semantic-release/github

      - name: Run semantic-release to build and create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: semantic-release

      - name: Publish to CurseForge using mc-publish
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: 1385947
          curseforge-token: ${{ secrets.CURSEFORGE_API_KEY }}
          modrinth-id: "ywJr8jKz"
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: "build/libs/artificialconnector-*.jar"